name: release-binaries

on:
  pull_request:
    branches:
      - nx2
      - nx2-experimental
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
      all_platforms:
        description: Also build Linux and macOS (slow; by default only Windows is built)
        type: boolean
        default: false
  push:
    branches:
      - nx2
      - nx2-experimental
    # A binary only changes when build inputs change; docs-only pushes skip the build.
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every build is named <channel>-build-<run number>: its release tag, its version string, and the
  # prefix of its release files. The channel is the branch, or pr-<number> for pull requests, which
  # are never released. The update checker only offers releases from the build's own channel.
  name:
    name: Name the build
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.name.outputs.channel }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - id: name
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            channel="pr-$PR_NUMBER"
          else
            channel="${GITHUB_REF_NAME//\//-}"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$channel-build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  # Every platform builds in parallel and the release waits for the slowest one, so the platforms
  # nobody downloads are left out unless a manual run ticks "all_platforms".
  plan:
    name: Pick platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          windows='{"platform":"windows-x86_64","runner":"windows-2022"}'
          others='{"platform":"linux-x86_64","runner":"ubuntu-24.04"},{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"platform":"macos-arm64","runner":"macos-15"}'
          if [ '${{ inputs.all_platforms }}' = 'true' ]; then
            echo "matrix={\"include\":[$windows,$others]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$windows]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: [name, plan]
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TAG: ${{ needs.name.outputs.tag }}
      ASSET_NAME: eglantine-${{ needs.name.outputs.tag }}-${{ matrix.platform }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: '1'
      # Runner images install the compiler fresh with a new mtime every run, and ccache's default
      # compiler check is the mtime, so without this every run misses the whole cache.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 2G
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache

      - name: Install Qt on Linux x86_64
        if: startsWith(matrix.platform, 'linux') && runner.arch != 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install Qt on Linux ARM64
        if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          brew install autoconf automake boost ccache cmake ffmpeg fmt glslang \
            libtool libusb lz4 ninja nlohmann-json openssl@3 pkgconf sdl3 \
            speexdsp zlib zstd

      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts
          cache: true

      - name: Set up MSVC
        if: matrix.platform == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Windows
        if: matrix.platform == 'windows-x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # MSVC is not something ccache handles well, so that job uses sccache. The other jobs use
      # ccache, which CMake enables through USE_CCACHE (externals/cmake-modules/UseCcache.cmake).
      - name: Install sccache on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: glslangValidator --version

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-

      # The run id and attempt in the key make every run (and every re-run) save a fresh cache (actions/cache never saves over an
      # exact hit), and restore-keys seeds it from the newest one of the same platform.
      - name: Restore compiler objects
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            .sccache
          key: objects-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}-

      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=ON
            "-DEGLANTINE_UPDATE_REPO=$GITHUB_REPOSITORY"
            "-DEGLANTINE_BUILD_TAG=$BUILD_TAG"
            "-DEGLANTINE_BUILD_PLATFORM=${{ matrix.platform }}"
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
          )
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: Configure macOS ARM
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix)"
          "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
          -DYUZU_USE_BUNDLED_SDL3=OFF
          -DYUZU_USE_BUNDLED_MOLTENVK=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DENABLE_UPDATE_CHECKER=ON
          "-DEGLANTINE_UPDATE_REPO=$GITHUB_REPOSITORY"
          "-DEGLANTINE_BUILD_TAG=$BUILD_TAG"
          "-DEGLANTINE_BUILD_PLATFORM=${{ matrix.platform }}"
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      - name: Configure Windows
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          "-DEGLANTINE_UPDATE_REPO=$GITHUB_REPOSITORY"
          "-DEGLANTINE_BUILD_TAG=$BUILD_TAG"
          "-DEGLANTINE_BUILD_PLATFORM=${{ matrix.platform }}"
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if command -v ccache > /dev/null; then ccache --zero-stats; else sccache --zero-stats; fi
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi

      - name: Build macOS ARM
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel 2 -- -k 0
          ccache --show-stats

      # Saved even when the build fails or the run is cancelled, so the objects compiled so far are
      # not lost. The run id and attempt in the key make every run (and every re-run) save a fresh cache.
      - name: Save compiler objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            .sccache
          key: objects-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package and verify macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          sh tools/macos/package.sh build/release "$ASSET_NAME.zip"

      - name: Stage third-party license notices
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p build/release/bin/licenses
          cp -R dist/licenses/. build/release/bin/licenses/

      - name: Package Linux tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/eglantine
          test -x build/release/bin/eden-cli
          strip build/release/bin/eglantine build/release/bin/eden-cli
          tar -czf "$ASSET_NAME.tar.gz" -C build/release/bin eglantine eden-cli licenses
          test -s "$ASSET_NAME.tar.gz"

      # A self-contained AppImage: linuxdeploy bundles every library the two programs need except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader),
      # and its Qt plugin adds the Qt libraries and platform plugins. Runs on glibc 2.39+ systems.
      - name: Package Linux AppImage
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/eglantine
          test -x build/release/bin/eden-cli
          # Libraries Qt's xcb platform plugin needs, so linuxdeploy can resolve and bundle them.
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage"
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon dev.eglantine.eglantine.
          icon="$RUNNER_TEMP/dev.eglantine.eglantine.png"
          cp dist/Eglantine.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LDAI_OUTPUT="$ASSET_NAME.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          mkdir -p AppDir/usr/share/licenses/eglantine
          cp -R dist/licenses/. AppDir/usr/share/licenses/eglantine/
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/eglantine \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/dev.eden_emu.eden.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      - name: Package Windows binary
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          foreach ($exe in 'eglantine.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/eglantine.exe

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        if: matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ${{ env.ASSET_NAME }}.tar.gz
            ${{ env.ASSET_NAME }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publishes every binary as a GitHub pre-release once every platform built: on pushes to nx2
  # and nx2-experimental, and on manual runs unless "Publish the binaries as a GitHub release" is
  # unticked.
  release:
    name: Publish release
    needs: [name, build]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: eglantine-${{ needs.name.outputs.tag }}-*
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")
            if compgen -G "$artifact*.AppImage" > /dev/null; then
              cp "$artifact"/*.AppImage "$artifact"/*.tar.gz dist/
            elif compgen -G "$artifact*.zip" > /dev/null; then
              cp "$artifact"/*.zip dist/
            else
              (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/dist/${name}.zip" .)
            fi
          done

      # The notes list the commits since the channel's previous release; the app shows users the
      # commits since their own build.
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.name.outputs.channel }}
          BUILD_TAG: ${{ needs.name.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la dist
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select(.tag_name | startswith(env.CHANNEL + "-build-"))][0].tag_name // empty')
          {
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" \
                --jq '.commits | reverse | .[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
              echo
            fi
            echo "## Install"
            echo
            echo "Windows: extract the zip and run eglantine.exe, or eden-cli.exe from a terminal."
            if compgen -G "dist/*.AppImage" > /dev/null; then
              echo "Linux (AppImage): make it executable (chmod +x) and run it; it bundles its libraries and needs glibc 2.39 or newer (Ubuntu 24.04, Fedora 40, Debian 13, Arch)."
              echo "Linux (tar.gz): extract it and run ./eglantine or ./eden-cli; it uses your system libraries, so Qt 6 and the usual libraries must be installed."
            fi
            if compgen -G "dist/*macos*" > /dev/null; then
              echo "macOS: Apple Silicon and macOS 15 or newer. Extract the zip and move eglantine.app to Applications. The CLI is inside eglantine.app/Contents/MacOS/eden-cli. The app bundles Qt and MoltenVK and is ad-hoc signed, not notarized; macOS may require approval in Privacy & Security. macOS support remains experimental and uses the JIT, not NCE."
            fi
            echo
            echo "Eglantine looks for newer builds of its channel at startup and from Help > Check for Updates."
          } > notes.md
          gh release create "$BUILD_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Eglantine $CHANNEL build $GITHUB_RUN_NUMBER (${GITHUB_SHA::7})" \
            --notes-file notes.md
