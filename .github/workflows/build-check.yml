name: build-check

# Compile check and unit tests for pull requests. release-binaries.yml only runs on pushes to
# nx2-experimental, so a PR currently gets no build signal at all (#135).

on:
  pull_request:
    branches:
      - nx2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-and-test:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # The package list and the configure flags mirror the linux-x86_64 job in
      # release-binaries.yml, with the tests that job turns off built and run.
      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-check-${{ runner.os }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-check-${{ runner.os }}-v2-

      - name: Restore compiler objects
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects-check-${{ runner.os }}-v2-${{ github.sha }}
          restore-keys: |
            objects-check-${{ runner.os }}-v2-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Build
        shell: bash
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Save compiler objects
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: objects-check-${{ runner.os }}-v2-${{ github.sha }}
